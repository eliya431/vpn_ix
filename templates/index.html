<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VPN IX | خرید VPN</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d19;color:white;font-family:Tahoma,Arial}
header{padding:22px 8%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #202b40}
.logo{font-size:26px;font-weight:bold;color:#42a5ff}
.hero{text-align:center;padding:100px 20px}
h1{font-size:38px}
p{color:#aab6ca;line-height:2}
button{background:#1688ff;color:white;border:0;padding:15px 30px;border-radius:10px;font-size:16px;cursor:pointer}
.cards{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;padding:20px}
.card{background:#111a2b;border:1px solid #263550;padding:28px;border-radius:16px;width:250px;text-align:center}
.price{font-size:25px;color:#42a5ff}
footer{text-align:center;padding:35px;color:#77859c}
</style>
</head>
<body>
<header>
<div class="logo">VPN IX</div>
<div>فروشگاه اینترنتی VPN</div>
</header>
<section class="hero">
<h1>اینترنت آزاد، سریع و امن</h1>
<p>پلن مناسب خودت رو انتخاب کن و خریدت رو شروع کن.</p>
<button onclick="document.getElementById('plans').scrollIntoView({behavior:'smooth'})">مشاهده پلن‌ها</button>
</section>
<section class="cards" id="plans">
<div class="card">
<h2>پلن یک‌ماهه</h2>
<p>مناسب استفاده روزانه</p>
<div class="price">قیمت به‌زودی</div>
</div>
<div class="card">
<h2>پلن سه‌ماهه</h2>
<p>مناسب استفاده طولانی‌تر</p>
<div class="price">قیمت به‌زودی</div>
</div>
<div class="card">
<h2>پلن ویژه</h2>
<p>برای کاربران حرفه‌ای</p>
<div class="price">قیمت: ۱۵۰,۰۰۰ تومان</div>
</div>
</section>
<footer>VPN IX | فروشگاه خدمات اینترنتی</footer>
</body>
</html>
